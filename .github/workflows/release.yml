name: 'Publish Release'
on:
  push:
    tags:
      - 'v*'
jobs:
  # Gate: nothing is built or published unless the tests pass. These are the
  # same checks CI runs on pull requests (see ci.yml), so a release commit
  # that was green in its PR is green here.
  test:
    name: Tests (${{ matrix.platform }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform: ['windows-latest', 'ubuntu-24.04']
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Frontend typecheck and tests
        if: runner.os == 'Linux'
        run: npm test
      # The Tauri crate needs the built frontend (frontendDist) at compile time.
      - name: Build frontend
        run: npm run build
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  publish-tauri:
    needs: test
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: '--bundles nsis'
          - platform: 'ubuntu-24.04'
            args: ''
          - platform: 'ubuntu-24.04-arm'
            args: ''
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin' # Apple Silicon (M1/M2/M3)
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'  # Intel Mac
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Verify release tag matches app version
        shell: bash
        run: |
          node <<'NODE'
          const { version } = require('./src-tauri/tauri.conf.json');
          if (process.env.GITHUB_REF_NAME !== `v${version}`) {
            throw new Error(`Release tag must be v${version} to match src-tauri/tauri.conf.json`);
          }
          NODE
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - name: Install frontend dependencies
        run: npm ci # or yarn install / pnpm install
      - name: Build and Publish Tauri App
        id: tauri-build
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__ # Uses version specified in src-tauri/tauri.conf.json
          releaseName: 'Drive Sonar v__VERSION__'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Extract .deb for snap packaging
        if: startsWith(matrix.platform, 'ubuntu-24.04')
        run: |
          DEB_PATH=$(echo '${{ steps.tauri-build.outputs.artifactPaths }}' | jq -r '.[] | select(endswith(".deb"))')
          echo "Using deb: $DEB_PATH"
          mkdir -p snap/extracted
          dpkg-deb -R "$DEB_PATH" snap/extracted

      - name: Build snap
        if: startsWith(matrix.platform, 'ubuntu-24.04')
        id: snapcraft-build
        uses: snapcore/action-build@v1

      - name: Publish snap to Snap Store
        if: startsWith(matrix.platform, 'ubuntu-24.04')
        uses: snapcore/action-publish@214b86e5ca036ead1668c79afb81e550e6c54d40 # v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.snapcraft-build.outputs.snap }}
          release: edge
