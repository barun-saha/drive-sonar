name: Publish to WinGet

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release-tag:
        description: 'Tag of the published GitHub release to submit to WinGet'
        required: true
        type: string

permissions:
  contents: read

jobs:
  winget:
    name: Publish WinGet Package
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Windows installer to be available
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release-tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $tag = $env:RELEASE_TAG
          if (-not $tag) {
            throw "Release tag could not be determined."
          }
          $version = $tag -replace '^v', ''
          $fileName = "Drive.Sonar_${version}_x64-setup.exe"
          $url = "https://github.com/${env:REPOSITORY}/releases/download/${tag}/${fileName}"

          Write-Host "Waiting for installer asset to become available at: $url"
          $maxWaitSeconds = 600
          $intervalSeconds = 30
          $elapsed = 0
          $ready = $false

          while ($elapsed -lt $maxWaitSeconds) {
            try {
              $response = Invoke-WebRequest -Uri $url -Method Head -UseBasicParsing -ErrorAction Stop
              if ($response.StatusCode -eq 200) {
                $ready = $true
                Write-Host "Asset is available."
                break
              }
            } catch {
              Write-Host "Asset not ready yet (${elapsed}s elapsed): $($_.Exception.Message)"
            }
            Start-Sleep -Seconds $intervalSeconds
            $elapsed += $intervalSeconds
          }

          if (-not $ready) {
            throw "Timed out after $maxWaitSeconds seconds waiting for $fileName at $url"
          }

      - name: Submit package update to WinGet
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: BarunSaha.DriveSonar
          release-tag: ${{ github.event.release.tag_name || inputs.release-tag }}
          installers-regex: '_x64-setup\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
