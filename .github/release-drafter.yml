name-template: 'Drive Sonar v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
tag-prefix: 'v'

change-template: '- $TITLE in #$NUMBER'

categories:
  - title: '🚀 Features & Enhancements'
    labels:
      - 'feature'
      - 'enhancement'
      - 'feat'
    when:
      conventional:
        types:
          - 'feat'

  - title: '🐛 Bug Fixes'
    labels:
      - 'fix'
      - 'bug'
    when:
      conventional:
        types:
          - 'fix'

  - title: '⚡ Performance Improvements'
    labels:
      - 'performance'
      - 'perf'
    when:
      conventional:
        types:
          - 'perf'

  - title: '📚 Documentation'
    labels:
      - 'documentation'
      - 'docs'
    when:
      conventional:
        types:
          - 'docs'

  - title: '🧰 Maintenance & CI'
    labels:
      - 'chore'
      - 'ci'
      - 'build'
      - 'refactor'
      - 'dependencies'
      - 'maintenance'
    collapse-after: 3
    when:
      conventional:
        types:
          - 'chore'
          - 'ci'
          - 'build'
          - 'refactor'
          - 'test'
          - 'style'

exclude-labels:
  - 'skip-changelog'
  - 'skip-release'

version-resolver:
  major:
    labels:
      - 'major'
      - 'breaking'
  minor:
    labels:
      - 'minor'
      - 'feature'
      - 'enhancement'
  patch:
    labels:
      - 'patch'
      - 'fix'
      - 'bug'
  default: patch

autolabeler:
  - label: 'feature'
    title:
      - '/^feat(\(.*\))?:/i'
  - label: 'fix'
    title:
      - '/^fix(\(.*\))?:/i'
  - label: 'performance'
    title:
      - '/^perf(\(.*\))?:/i'
  - label: 'documentation'
    title:
      - '/^docs(\(.*\))?:/i'
  - label: 'chore'
    title:
      - '/^chore(\(.*\))?:/i'
      - '/^refactor(\(.*\))?:/i'
  - label: 'ci'
    title:
      - '/^ci(\(.*\))?:/i'
      - '/^build(\(.*\))?:/i'
  - label: 'dependencies'
    branch:
      - '/dependabot\/.*/i'
    title:
      - '/^bump/i'
      - '/^build\(deps.*?\):/i'

template: |
  ## What's Changed

  $CHANGES

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...$RESOLVED_VERSION

  ---
  *Platform installation binaries are attached below.*
